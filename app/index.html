<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#052f3d" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KMZERO" />
    <meta name="description" content="KMZERO - Sistema de gestão inteligente de obras. KM Consultoria, Assessoria e Serviços de Engenharia." />
    <title>KMZERO - Gestão de Obras</title>
    <script>
      /* Anti-FOUC: decide o tema ANTES do CSS e do React, senão o app pisca claro.
         Mesma regra de src/lib/useTema.js: _kmzero_tema 'claro' | 'escuro' | 'auto';
         'auto' = escuro no escritório (PC >= 1024), claro no app de campo. */
      (function () {
        var p = null;
        try { p = localStorage.getItem('_kmzero_tema'); } catch (e) {}
        var tema = (p === 'claro' || p === 'escuro') ? p : (window.innerWidth >= 1024 ? 'escuro' : 'claro');
        document.documentElement.dataset.tema = tema;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', tema === 'escuro' ? '#081a21' : '#052f3d');
      })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Barlow:wght@700;800&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #f7fbfc;
        background: var(--km-fundo, #f7fbfc);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overscroll-behavior: none;
      }
      /* Fallback enquanto src/tema.css não carregou (o token chega com o bundle) */
      html[data-tema="escuro"], html[data-tema="escuro"] body {
        background: #081a21;
        background: var(--km-fundo, #081a21);
      }
      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }
      .loading-splash {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #081a21, #052f3d);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #fff;
        z-index: 9999;
      }
      /* Lockup KM|ZERO: Barlow 800 com fallback Inter 900 se a fonte não estiver em cache */
      .loading-splash .logo {
        font-family: Barlow, Inter, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 48px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      .loading-splash .logo span { color: #ffb830; }
      .loading-splash .sub {
        font-size: 11px;
        font-weight: 700;
        color: rgba(255,255,255,0.55);
        text-transform: uppercase;
        letter-spacing: 3px;
        margin-top: 8px;
      }
      .loading-splash .spinner {
        margin-top: 30px;
        width: 30px;
        height: 30px;
        border: 3px solid rgba(255,255,255,0.2);
        border-top-color: #ffb830;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-splash">
        <div class="logo">KM<span>ZERO</span></div>
        <div class="sub">Gestão de Obras</div>
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
